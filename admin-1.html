<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{--p:#ffc107;--bg:#070b12;--card:#111927;--card2:#0b111e;--text:#f8f9fa;--muted:#94a3b8;--border:#1e293b;--green:#22c55e;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
body{background:var(--bg);color:var(--text)}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008}
.logo{text-align:center;color:var(--p);font-size:26px;font-weight:900}.sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 25px}
label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:12px;background:var(--card2);color:white;border:1px solid var(--border);border-radius:9px;outline:none}
input:focus,select:focus{border-color:var(--p)}
button{border:0;cursor:pointer}
.loginbtn{width:100%;padding:14px;margin-top:20px;border-radius:10px;background:linear-gradient(135deg,#ffc107,#ff9800);font-weight:900}
.error{text-align:center;color:#f87171;font-size:12px;margin-top:12px}
.admin{display:none}.top{height:65px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.title{color:var(--p);font-weight:900;font-size:20px}.logout{background:#293241;color:white;padding:9px 14px;border-radius:8px;font-weight:700}
.wrap{max-width:1400px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}.stat small{color:var(--muted);font-weight:700}.num{font-size:28px;font-weight:900;color:var(--p);margin-top:5px}
.toolbar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:10px;margin-bottom:14px}.toolbar input{margin:0;flex:1}.toolbar select{margin:0;width:190px}.refresh{background:var(--p);padding:0 18px;border-radius:8px;font-weight:900}
.cards{display:grid;gap:12px}.reg{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.head{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:900}.token{font-size:12px;color:var(--p);font-weight:700;margin-top:3px}
.badge{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:900;height:max-content}.Pending{background:#78350f;color:#fbbf24}.Approved{background:#14532d;color:#4ade80}.Rejected{background:#7f1d1d;color:#f87171}
.details{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.detail{background:var(--card2);border:1px solid var(--border);padding:9px;border-radius:8px}.detail small{display:block;color:var(--muted);font-size:9px}.detail b{font-size:13px;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.action{padding:9px 12px;border-radius:8px;color:#fff;font-size:12px;font-weight:800}.view{background:#1d4ed8}.approve{background:#15803d}.reject{background:#b91c1c}.delete{background:#374151}
.empty{text-align:center;padding:50px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:14px}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:50;align-items:center;justify-content:center;padding:15px}.modalbox{width:100%;max-width:750px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{background:#374151;color:white;border-radius:7px;width:32px;height:32px}.doc{max-width:100%;max-height:65vh;display:block;margin:auto;border-radius:10px;background:#000}.open{display:block;text-align:center;background:var(--p);color:#000;text-decoration:none;padding:11px;border-radius:8px;font-weight:900;margin-top:12px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}.toolbar select{width:100%;height:44px}.refresh{height:44px}}
@media(max-width:500px){.wrap{padding:10px}.top{padding:0 12px}.title{font-size:17px}.details{grid-template-columns:1fr 1fr}.stat{padding:13px}.num{font-size:22px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-box">
    <div class="logo">🏏 PPL ADMIN</div>
    <div class="sub">Patharia Premier League • 2026</div>
    <label>Admin Email</label>
    <input id="email" type="email" placeholder="Enter admin email">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password">
    <button class="loginbtn" onclick="login()">LOGIN TO ADMIN PANEL</button>
    <div id="err" class="error"></div>
  </div>
</div>

<div id="admin" class="admin">
  <div class="top">
    <div class="title">🏏 PPL ADMIN PANEL</div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><small>TOTAL</small><div class="num" id="total">0</div></div>
      <div class="stat"><small>PLAYERS</small><div class="num" id="players">0</div></div>
      <div class="stat"><small>TEAMS</small><div class="num" id="teams">0</div></div>
      <div class="stat"><small>PENDING</small><div class="num" id="pending">0</div></div>
    </div>
    <div class="toolbar">
      <input id="search" placeholder="Search name, phone, token, UTR..." oninput="render()">
      <select id="filter" onchange="render()">
        <option value="all">All Registrations</option>
        <option value="Senior">Senior Players</option>
        <option value="Junior">Junior Players</option>
        <option value="Team">Teams</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button class="refresh" onclick="load()">↻ Refresh</button>
    </div>
    <div id="list"><div class="empty">Loading...</div></div>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <div class="modalhead"><h3 id="modalTitle">Document</h3><button class="close" onclick="closeModal()">✕</button></div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyOQ8YKgPIm7eZaCKw1rShMbqZ3j5oSh_OA",
 authDomain:"patharia-e02ff.firebaseapp.com",
 projectId:"patharia-e02ff",
 storageBucket:"patharia-e02ff.firebasestorage.app",
 messagingSenderId:"932166360661",
 appId:"1:932166360661:web:4ae3e997483c7c913b3edc"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let rows=[];

function login(){
 const e=document.getElementById("email").value.trim(),p=document.getElementById("password").value;
 document.getElementById("err").textContent="";
 if(!e||!p){document.getElementById("err").textContent="Email and password required";return}
 auth.signInWithEmailAndPassword(e,p).catch(x=>document.getElementById("err").textContent=x.message);
}
function logout(){auth.signOut()}
auth.onAuthStateChanged(u=>{
 document.getElementById("login").style.display=u?"none":"flex";
 document.getElementById("admin").style.display=u?"block":"none";
 if(u)load();
});

async function load(){
 document.getElementById("list").innerHTML='<div class="empty">Loading registrations...</div>';
 try{
   const s=await db.collection("registrations").get();
   rows=s.docs.map(d=>({id:d.id,...d.data()}));
   rows.sort((a,b)=>{
     const aa=a.Created_At?.seconds||0,bb=b.Created_At?.seconds||0; return bb-aa;
   });
   stats();render();
 }catch(e){document.getElementById("list").innerHTML='<div class="empty">Could not load data.<br>'+esc(e.message)+'</div>'}
}
function stats(){
 document.getElementById("total").textContent=rows.length;
 document.getElementById("players").textContent=rows.filter(x=>x.Registration_Type==="Senior"||x.Registration_Type==="Junior").length;
 document.getElementById("teams").textContent=rows.filter(x=>x.Registration_Type==="Team").length;
 document.getElementById("pending").textContent=rows.filter(x=>(x.Status||"Pending")==="Pending").length;
}
function render(){
 const q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;
 const data=rows.filter(r=>{
   const status=r.Status||"Pending";
   const text=[r.Player_Name,r.Team_Name,r.Owner_Name,r.Phone,r.City,r.Token_ID,r.UTR,r.Role,r.Registration_Type].join(" ").toLowerCase();
   if(q&&!text.includes(q))return false;
   if(["Senior","Junior","Team"].includes(f)&&r.Registration_Type!==f)return false;
   if(["Pending","Approved","Rejected"].includes(f)&&status!==f)return false;
   return true;
 });
 if(!data.length){document.getElementById("list").innerHTML='<div class="empty">No registrations found.</div>';return}
 document.getElementById("list").innerHTML=data.map(r=>{
   const status=r.Status||"Pending",name=r.Player_Name||r.Team_Name||"Unknown";
   return `<div class="reg">
    <div class="head"><div><div class="name">${esc(name)}</div><div class="token">${esc(r.Token_ID||"")}</div></div><div class="badge ${status}">${status.toUpperCase()}</div></div>
    <div class="details">
      ${d("Category",r.Registration_Type)}${d("Phone",r.Phone)}${d("City",r.City)}${d("UTR",r.UTR)}
      ${d("Role",r.Role)}${d("Owner",r.Owner_Name)}${d("DOB",r.DOB)}${d("Batting",r.Batting_Style)}
    </div>
    <div class="actions">
      ${r.Photo_URL?`<button class="action view" onclick="showFile('${url(r.Photo_URL)}','Profile Photo')">🖼️ Photo</button>`:""}
      ${r.Document_URL?`<button class="action view" onclick="showFile('${url(r.Document_URL)}','Aadhar / Document')">🪪 Aadhar</button>`:""}
      ${r.Payment_SS_URL?`<button class="action view" onclick="showFile('${url(r.Payment_SS_URL)}','Payment Screenshot')">💳 Payment</button>`:""}
      ${status!=="Approved"?`<button class="action approve" onclick="status('${r.id}','Approved')">✅ Approve</button>`:""}
      ${status!=="Rejected"?`<button class="action reject" onclick="status('${r.id}','Rejected')">❌ Reject</button>`:""}
      <button class="action delete" onclick="del('${r.id}')">🗑️ Delete</button>
    </div>
   </div>`;
 }).join("");
}
function d(k,v){return `<div class="detail"><small>${esc(k)}</small><b>${esc(v||"-")}</b></div>`}
async function status(id,s){
 try{await db.collection("registrations").doc(id).update({Status:s,Status_Updated_At:firebase.firestore.FieldValue.serverTimestamp()});await load()}
 catch(e){alert(e.message)}
}
async function del(id){
 if(!confirm("Delete this registration permanently?"))return;
 try{await db.collection("registrations").doc(id).delete();await load()}catch(e){alert(e.message)}
}
function showFile(u,t){
 document.getElementById("modalTitle").textContent=t;
 document.getElementById("modalContent").innerHTML=`<img class="doc" src="${u}" alt="${esc(t)}"><a class="open" href="${u}" target="_blank" rel="noopener">OPEN FULL SIZE</a>`;
 document.getElementById("modal").style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function url(v){return String(v).replace(/'/g,"%27").replace(/"/g,"%22")}
</script>
</body>
</html>
